name: Pointlook Android ARM64 Build

on:
  workflow_dispatch:
  push:
    tags:
      - "pointlook-v*"

permissions:
  contents: read

concurrency:
  group: pointlook-android-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Chromium requires a large Linux x86-64 machine. Configure a self-hosted
    # runner with the labels below; GitHub-hosted runners are not suitable.
    runs-on: [self-hosted, linux, x64, chromium-android]
    timeout-minutes: 720

    steps:
      - name: Check runner capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64" || {
            echo "::error::Chromium Android builds require an x86-64 Linux host."
            exit 1
          }
          free_gb="$(df -BG "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub(/G/, "", $4); print $4}')"
          memory_kb="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          memory_gb="$((memory_kb / 1024 / 1024))"
          echo "Free disk: ${free_gb} GB"
          echo "RAM: ${memory_gb} GB"
          test "$free_gb" -ge 100 || {
            echo "::error::At least 100 GB free disk space is required."
            exit 1
          }
          test "$memory_gb" -ge 16 || {
            echo "::error::At least 16 GB RAM is required; more is recommended."
            exit 1
          }
          test -n "${DEPOT_TOOLS_PATH:-}" || {
            echo "::error::Set DEPOT_TOOLS_PATH on the self-hosted runner."
            exit 1
          }
          test -x "$DEPOT_TOOLS_PATH/gclient" || {
            echo "::error::DEPOT_TOOLS_PATH must point to a valid depot_tools checkout."
            exit 1
          }
          echo "$DEPOT_TOOLS_PATH" >> "$GITHUB_PATH"

      - name: Checkout Pointlook branding changes
        uses: actions/checkout@v4
        with:
          path: branding
          ref: pointlook-branding
          fetch-depth: 1

      - name: Checkout complete Chromium source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 132.0.6834.83 https://chromium.googlesource.com/chromium/src.git src
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["android"]
          EOF

      - name: Apply Pointlook branding
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("chrome/android/chrome_public_apk_tmpl.gni"): (
                  'chrome_public_manifest_package = "org.chromium.chrome"',
                  'chrome_public_manifest_package = "com.crossberry.pointlook"',
              ),
              Path("chrome/android/java/res_chromium_base/values/channel_constants.xml"): (
                  '<string name="app_name" translatable="false">Chromium</string>',
                  '<string name="app_name" translatable="false">Pointlook</string>',
              ),
          }
          for path, (old, new) in replacements.items():
              data = path.read_text()
              if data.count(old) != 1:
                  raise SystemExit(f"Expected exactly one branding value in {path}")
              path.write_text(data.replace(old, new, 1))
              print(f"Applied Pointlook branding: {path}")
          PY
          mkdir -p scripts
          cp ../branding/scripts/build_android_arm64.sh scripts/build_android_arm64.sh

      - name: Install Linux and Android build dependencies
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          sudo ./build/install-build-deps.sh --android --no-prompt

      - name: Sync Chromium dependencies and run hooks
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          gclient sync --no-history
          gclient runhooks

      - name: Build Pointlook APK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build_android_arm64.sh

      - name: Upload Pointlook APK
        uses: actions/upload-artifact@v4
        with:
          name: Pointlook-Android-ARM64
          path: src/out/Pointlook/apks/*.apk
          if-no-files-found: error
          retention-days: 30
